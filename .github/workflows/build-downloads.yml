name: Build PC and Android downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - '.github/workflows/build-downloads.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save electron electron-builder
      - name: Package Windows portable executable
        shell: pwsh
        run: npx electron-builder --win portable --x64 --config.directories.output=release --config.extraMetadata.main=electron/main.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: HostelSplit-PC-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - name: Create Android wrapper
        run: |
          npx cap init HostelSplit com.ayushydv1805.hostelsplit --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HostelSplit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
