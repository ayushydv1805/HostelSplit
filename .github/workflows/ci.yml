name: HostelSplit CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Summarize dependency advisories
        run: |
          npm audit --json > /tmp/hostelsplit-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/hostelsplit-audit.json", "utf8"));
          const summary = Object.entries(report.vulnerabilities || {}).map(([name, issue]) => ({
            name,
            severity: issue.severity,
            isDirect: issue.isDirect,
            range: issue.range,
            fixAvailable: issue.fixAvailable,
            advisories: (issue.via || []).filter((item) => typeof item === "object").map((item) => ({
              title: item.title,
              url: item.url,
              range: item.range,
            })),
          }));
          console.log(JSON.stringify({ counts: report.metadata && report.metadata.vulnerabilities, vulnerabilities: summary }, null, 2));
          NODE
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
