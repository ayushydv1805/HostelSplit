name: Patch dependencies safely

on:
  push:
    branches:
      - "fix/audit-dependencies"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Patch fixable vulnerabilities
        run: npm audit fix
      - name: Run unit tests
        run: npm test
      - name: Run linter
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: patch vulnerable dependencies [skip ci]"
            git push origin HEAD:fix/audit-dependencies
          else
            echo "No dependency updates needed."
          fi
